<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
    display: flex;
    height: 100vh;
    color: white;
    background: #1e1e1e;
  }

  /* Vertical sidebar */
  #tabbar {
    width: 120px;
    background: #2b2b2b;
    display: flex;
    flex-direction: column;
    padding: 10px 5px;
    box-sizing: border-box;
  }

  #tabs {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .tab {
    padding: 10px;
    margin-bottom: 5px;
    background: #3a3a3a;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }

  .tab.active { background: #555; }

  #addTab {
    padding: 10px;
    font-size: 20px;
    cursor: pointer;
    text-align: center;
    background: #444;
    border-radius: 6px;
    margin-top: 5px;
  }

  #addTab:hover { background: #666; }

  /* Address bar container */
  #addressBarContainer {
    position: absolute;
    left: 120px; /* next to sidebar */
    top: 0;
    right: 0;
    height: 30px;
    background: #2b2b2b;
    display: flex;
    align-items: center;
    padding: 0 5px;
    box-sizing: border-box;
  }

  #addressBar {
    flex: 1;
    padding: 4px 8px;
    border-radius: 4px;
    border: none;
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- Vertical tabs -->
<div id="tabbar">
  <div id="tabs"></div>
  <div id="addTab">+</div>
</div>

<!-- Address bar -->
<div id="addressBarContainer">
  <input id="addressBar" type="text" placeholder="Enter URL and press Enter">
</div>

<script>
  const { ipcRenderer } = require('electron');

  const tabsContainer = document.getElementById("tabs");
  const addTabButton = document.getElementById("addTab");
  const addressInput = document.getElementById("addressBar");

  let tabCount = 0;
  let tabURLs = [];

  function createTabUI(initialURL = "https://google.com") {
    const tab = document.createElement("div");
    tab.classList.add("tab");
    tab.textContent = "Tab " + (tabCount + 1);

    const index = tabCount;

    tab.addEventListener("click", () => {
      setActiveTab(index);
      ipcRenderer.send("switch-tab", index);
      addressInput.value = tabURLs[index]; // update address bar
    });

    tabsContainer.appendChild(tab);
    tabURLs.push(initialURL);

    tabCount++;
    setActiveTab(index);

    // Tell main to create tab
    ipcRenderer.send("new-tab", initialURL);
  }

  function setActiveTab(index) {
    const allTabs = document.querySelectorAll(".tab");
    allTabs.forEach((t, i) => {
      t.classList.toggle("active", i === index);
    });
  }

  addTabButton.addEventListener("click", () => {
    createTabUI("https://google.com");
  });

  // Address bar Enter press
  addressInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const activeIndex = [...document.querySelectorAll(".tab")].findIndex(t => t.classList.contains("active"));
      const url = addressInput.value.startsWith("http") ? addressInput.value : "https://" + addressInput.value;
      tabURLs[activeIndex] = url;
      ipcRenderer.send("navigate-tab", { index: activeIndex, url });
    }
  });

  // First tab
  createTabUI("https://google.com");
</script>

</body>
</html>
